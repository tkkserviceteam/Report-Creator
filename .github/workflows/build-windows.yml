name: Build Windows Portable EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install build dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Install Tesseract OCR
        shell: powershell
        run: |
          choco install tesseract --yes --no-progress
          $src = 'C:\Program Files\Tesseract-OCR'
          if (-not (Test-Path $src)) { throw "Tesseract not found at $src" }
          if (Test-Path 'ocr') { Remove-Item 'ocr' -Recurse -Force }
          Copy-Item $src 'ocr' -Recurse
          if (-not (Test-Path 'ocr\tesseract.exe')) { throw 'ocr\tesseract.exe missing' }
          if (-not (Test-Path 'ocr\tessdata\eng.traineddata')) { throw 'eng.traineddata missing' }
          Get-ChildItem 'ocr\tessdata' -Filter '*.traineddata' | Where-Object { $_.Name -ne 'eng.traineddata' } | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem 'ocr' -Include '*.html','*.txt','*.md' -File -Recurse | Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Verify source resources
        shell: powershell
        run: |
          Write-Host "Repository root: $PWD"
          Get-ChildItem -Recurse -Depth 2 | Select-Object FullName
          if (-not (Test-Path 'templates\sample.xlsx')) { throw 'SOURCE templates\sample.xlsx missing. Upload the templates folder from v0.3.2 to the repository root.' }
          if (-not (Test-Path 'templates\sample_without_ccd.xlsx')) { throw 'SOURCE templates\sample_without_ccd.xlsx missing.' }
          if (-not (Test-Path 'config.json')) { throw 'SOURCE config.json missing.' }

      - name: Build portable app
        shell: cmd
        run: build_github.bat

      - name: Assemble portable package
        shell: powershell
        run: |
          $pkg = 'release\CPK_Report_Generator'
          if (-not (Test-Path "$pkg\CPK_Report_Generator.exe")) { throw 'EXE missing before package assembly' }
          New-Item -ItemType Directory -Force -Path "$pkg\templates" | Out-Null
          New-Item -ItemType Directory -Force -Path "$pkg\ocr" | Out-Null
          New-Item -ItemType Directory -Force -Path "$pkg\Report History" | Out-Null
          Copy-Item -LiteralPath 'templates\sample.xlsx' -Destination "$pkg\templates\sample.xlsx" -Force
          Copy-Item -LiteralPath 'templates\sample_without_ccd.xlsx' -Destination "$pkg\templates\sample_without_ccd.xlsx" -Force
          Copy-Item -LiteralPath 'config.json' -Destination "$pkg\config.json" -Force
          Copy-Item -Path 'ocr\*' -Destination "$pkg\ocr" -Recurse -Force
          if (Test-Path 'README_USER.txt') { Copy-Item -LiteralPath 'README_USER.txt' -Destination "$pkg\README_USER.txt" -Force }
          Write-Host 'Portable package size:'
          $bytes=(Get-ChildItem $pkg -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host (([math]::Round($bytes/1MB,1)).ToString() + ' MB')

      - name: Smoke test files
        shell: powershell
        run: |
          if (-not (Test-Path 'release\CPK_Report_Generator\CPK_Report_Generator.exe')) { throw 'EXE missing' }
          if (-not (Test-Path 'release\CPK_Report_Generator\templates\sample.xlsx')) { throw 'sample.xlsx missing from final portable package' }
          if (-not (Test-Path 'release\CPK_Report_Generator\templates\sample_without_ccd.xlsx')) { throw 'sample_without_ccd.xlsx missing from final portable package' }
          if (-not (Test-Path 'release\CPK_Report_Generator\ocr\tesseract.exe')) { throw 'tesseract.exe missing' }
          if (-not (Test-Path 'release\CPK_Report_Generator\config.json')) { throw 'config.json missing' }

      - name: Create ZIP
        shell: powershell
        run: |
          Compress-Archive -Path 'release\CPK_Report_Generator' -DestinationPath 'CPK_Report_Generator_Windows_x64_Portable.zip' -Force

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: CPK_Report_Generator_Windows_x64_Portable
          path: CPK_Report_Generator_Windows_x64_Portable.zip
          if-no-files-found: error
          retention-days: 30
